<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { width: 1024px; height: 1024px; }
</style>
</head>
<body>
<div id="stage">
  <svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <!-- 深蓝圆角底板 -->
    <rect x="112" y="112" width="800" height="800" rx="180" fill="#1E2A44"/>
    <g id="ring"></g>
    <!-- 白色中心盘 -->
    <circle cx="512" cy="512" r="168" fill="#FFFFFF"/>
    <!-- 中心扁平数据条 -->
    <rect x="424" y="452" width="130" height="26" rx="13" fill="#C9CFDA"/>
    <rect x="424" y="500" width="176" height="26" rx="13" fill="#8B93A3"/>
    <rect x="424" y="548" width="98" height="26" rx="13" fill="#C9CFDA"/>
    <circle cx="628" cy="465" r="14" fill="#F59E0B"/>
  </svg>
</div>
<script>
  // 8 段圆角胶囊扇区（stroke round 端帽）
  const colors = ["#F59E0B","#F97316","#16A34A","#0891B2","#3B82F6","#8B5CF6","#EC4899","#65A30D"];
  const cx = 512, cy = 512, r = 252, w = 150, gap = 10;
  const span = 360 / 8, occupied = span - gap;
  const capDeg = (w / 2 / r) * 180 / Math.PI;
  const drawn = occupied - capDeg * 2;
  const g = document.getElementById("ring");
  colors.forEach((c, i) => {
    const a0 = -90 + i * span + (occupied - drawn) / 2;
    const a1 = a0 + drawn;
    const p = (deg) => {
      const rad = deg * Math.PI / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    };
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1}`);
    path.setAttribute("stroke", c);
    path.setAttribute("stroke-width", w);
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("fill", "none");
    g.appendChild(path);
  });
  document.title = "ready";
</script>
</body>
</html>
