<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { width: 64px; height: 64px; }
</style>
</head>
<body>
<div id="stage">
  <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <!-- 菜单栏模板图标：8 段甜甜圈（template 模式下按 alpha 渲染） -->
    <g id="ring"></g>
    <circle cx="32" cy="32" r="9" fill="#000000"/>
  </svg>
</div>
<script>
  const colors = ["#111","#111","#111","#111","#111","#111","#111","#111"];
  const cx = 32, cy = 32, r = 20, w = 11, gap = 16;
  const span = 360 / 8, occupied = span - gap;
  const capDeg = (w / 2 / r) * 180 / Math.PI;
  const drawn = occupied - capDeg * 2;
  const g = document.getElementById("ring");
  colors.forEach((c, i) => {
    const a0 = -90 + i * span + (occupied - drawn) / 2;
    const a1 = a0 + drawn;
    const p = (deg) => {
      const rad = deg * Math.PI / 180;
      return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
    };
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M ${x0} ${y0} A ${r} ${r} 0 0 1 ${x1} ${y1}`);
    path.setAttribute("stroke", c);
    path.setAttribute("stroke-width", w);
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("fill", "none");
    g.appendChild(path);
  });
  document.title = "ready";
</script>
</body>
</html>
